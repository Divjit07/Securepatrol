    <link rel="manifest" href="/manifest.json" />

    <!-- Warm the connections the first paint depends on: fonts + Supabase API -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Instrument+Sans:wght@500;600;700&family=Instrument+Serif:ital@0;1&display=swap"
    />
    <title>Kratos | Workforce Command</title>
      <script>
      try {
        var saved = localStorage.getItem('sp-theme')
        var aliases = { moss: 'forest', lagoon: 'sky', meadow: 'day', orchid: 'ivory', rose: 'ivory' }
        var id = aliases[saved] || saved
        var valid = { night:1, day:1, forest:1, matte:1, graphite:1, ivory:1, sky:1, studio:1 }
        if (!valid[id]) {
          id = window.matchMedia('(prefers-color-scheme: light)').matches ? 'day' : 'night'
        }
        document.documentElement.dataset.theme = id
      } catch (e) {
        document.documentElement.dataset.theme = 'night'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
