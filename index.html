    />
    <title>Kratos | Workforce Command</title>
      <script>
      try {
        var saved = localStorage.getItem('sp-theme')
        // Retired themes collapse to the black primary; only night + day remain.
        var valid = { night: 1, day: 1 }
        var id = valid[saved] ? saved : 'night'
        document.documentElement.dataset.theme = id
      } catch (e) {
        document.documentElement.dataset.theme = 'night'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
